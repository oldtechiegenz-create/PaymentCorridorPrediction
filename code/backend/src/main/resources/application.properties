spring.application.name=corridoriq-backend
# The portal calls http://127.0.0.1:8000 by default.
server.port=${PORT:8000}

# The API speaks snake_case JSON, as the portal and the Python prediction service expect.
spring.jackson.property-naming-strategy=SNAKE_CASE

# Paths are relative to code/backend, where ./mvnw runs. Override with environment variables,
# e.g. CORRIDORIQ_DB=/data/corridoriq_history.db or CORRIDORIQ_PREDICTION_URL=http://ml:8001.
corridoriq.db=../../Data/corridoriq_history/corridoriq_history.db
corridoriq.sql=../../Data/corridoriq_history/historical_cases.sql
corridoriq.portal=../../corridoriq.html

# Python prediction service (code/prediction_service/api.py): route ranking and time/cost models.
corridoriq.prediction.url=http://127.0.0.1:8001
corridoriq.prediction.connect-timeout=2s
corridoriq.prediction.read-timeout=10s

# Logging. Every API call logs "-->" on arrival and "<--" with status and time; every named query logs
# its name, the views/tables it reads, parameters, rows and time ("SQL ..."); every prediction-service
# call logs "ML ...". The [id] after the level is the request id (X-Request-Id), shared by all lines
# of one call. Set com.corridoriq.backend.history to DEBUG to also print the SQL text of each query.
logging.level.com.corridoriq.backend=INFO
logging.pattern.level=%5p [%X{requestId:--}]
# To keep the logs in a file as well as on the console:
# logging.file.name=logs/corridoriq-backend.log
